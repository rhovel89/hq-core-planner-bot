name: HQ worker recovery checks

on:
  push:
    branches:
      - repair/hq-runtime-20261021
  pull_request:

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Check out current branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python syntax verification
        run: python -m py_compile hq_core_planner_bot.py scripts/preflight_storage.py
      - name: Validate portable worker startup shell
        run: sh -n scripts/start_hq_worker.sh
      - name: Offline storage safeguards
        run: python -m unittest discover -s tests -v
